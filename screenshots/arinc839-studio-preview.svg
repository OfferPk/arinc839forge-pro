  <rect x="735" y="140" width="220" height="32" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="745" y="161" fill="#38bdf8" font-size="11" font-family="monospace">0x83B408B9 [ODD OK]</text>

  <text x="735" y="195" fill="#94a3b8" font-size="11">Label 272 (Active Link SNR &amp; Q):</text>
  <rect x="735" y="205" width="220" height="32" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="745" y="226" fill="#38bdf8" font-size="11" font-family="monospace">0x811800BA [ODD OK]</text>

  <rect x="735" y="255" width="220" height="40" rx="4" fill="#1e293b" />
  <text x="845" y="280" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">BIT 32 ODD PARITY VALID</text>

  <!-- Right Bottom: 10-Point Normative Auditor -->
  <rect x="715" y="335" width="260" height="240" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
