  <text x="355" y="440" fill="#38bdf8" font-size="10" font-family="monospace">[07:35:01 UTC] MAGC LRU online. Initializing multi-bearer sync.</text>
  <text x="355" y="460" fill="#10b981" font-size="10" font-family="monospace">[07:35:04 UTC] Phase: CRUISE_CONTINENTAL. ATS -&gt; VDL_MODE_2.</text>
  <text x="355" y="480" fill="#38bdf8" font-size="10" font-family="monospace">[07:35:06 UTC] Dispatched ATS CPDLC via VDL2 (Latency: 350ms).</text>
  <text x="355" y="500" fill="#f59e0b" font-size="10" font-family="monospace">[07:35:08 UTC] AOC Flight Plan enqueued and routed via VDL2.</text>
  <text x="355" y="520" fill="#10b981" font-size="10" font-family="monospace">[07:35:10 UTC] Standby SATCOM ready for oceanic transition.</text>
  <text x="355" y="540" fill="#94a3b8" font-size="10" font-family="monospace">[07:35:12 UTC] Parity verification on Labels 271/272 confirmed.</text>

