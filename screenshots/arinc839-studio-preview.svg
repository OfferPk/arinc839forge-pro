  <text x="735" y="395" fill="#94a3b8" font-size="11">NORMATIVE SCORE:</text>
  <text x="735" y="415" fill="#10b981" font-size="14" font-weight="bold">10 / 10 CHECKS PASSED (100%)</text>

  <text x="735" y="445" fill="#94a3b8" font-size="11">CERTIFICATION STATUS:</text>
  <text x="735" y="465" fill="#38bdf8" font-size="11" font-weight="bold">ARINC 839 MAGC CERTIFIED</text>

  <text x="735" y="495" fill="#94a3b8" font-size="11">REGULATORY CONFORMANCE:</text>
  <text x="735" y="515" fill="#f8fafc" font-size="10">RTCA DO-358A • RTCA DO-219</text>
  <text x="735" y="530" fill="#f8fafc" font-size="10">FAA AC 20-140C • ICAO Annex 10</text>

  <rect x="735" y="542" width="220" height="22" rx="3" fill="#064e3b" />
  <text x="845" y="557" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">AUDIT VERIFIED &amp; COMPLIANT</text>
</svg>