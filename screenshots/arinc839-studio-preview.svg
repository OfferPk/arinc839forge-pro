  <text x="45" y="130" fill="#f8fafc" font-size="12">Phase:</text>
  <text x="160" y="130" fill="#10b981" font-size="12" font-weight="bold">CRUISE CONTINENTAL</text>
  
  <text x="45" y="160" fill="#f8fafc" font-size="12">Policy Mode:</text>
  <text x="160" y="160" fill="#38bdf8" font-size="11" font-weight="bold">LEAST COST / SAFETY</text>

