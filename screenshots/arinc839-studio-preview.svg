  <text x="45" y="425" fill="#94a3b8" font-size="11">VDL Mode 2 (VHF):</text>
  <text x="210" y="425" fill="#10b981" font-size="11" font-weight="bold">ACTIVE (24dB)</text>

  <text x="45" y="455" fill="#94a3b8" font-size="11">SATCOM Aero (SBB):</text>
  <text x="210" y="455" fill="#38bdf8" font-size="11" font-weight="bold">STANDBY (19dB)</text>

