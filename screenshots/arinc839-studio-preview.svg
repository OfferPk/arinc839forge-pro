<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0a0e17; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,monospace;">
  <rect width="1000" height="600" fill="#0a0e17" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="25" y="32" fill="#38bdf8" font-size="16" font-weight="bold">ARINC839Forge Pro v1.0.0</text>
  <text x="240" y="32" fill="#64748b" font-size="12">| Manager of Air-Ground Communications (MAGC) Studio</text>
  
  <rect x="740" y="12" width="235" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="758" cy="25" r="5" fill="#10b981" />
  <text x="773" y="29" fill="#10b981" font-size="11" font-weight="bold">MULTI-LINK POLICY ROUTER ONLINE</text>

